  - dataset: fivetran_salesforce
    reason: "Customer service cases/contacts, not marketing reports"
  - dataset: fivetran_prm_salesforce
    reason: "Physician relationship management — not marketing"
  - dataset: data_mart_claims
    reason: "PRM physician claims data — not marketing"
  # Raw bronze (Fivetran/Airbyte) — only for engineering
  - prefix: fivetran_
    reason: "Bronze layer — raw vendor imports. Use gold/data_mart instead."
  - prefix: airbyte_
    reason: "Bronze layer — raw vendor imports."
  - prefix: adwords_
    reason: "Bronze layer — superseded by gold.ad_fact_ads"
  - prefix: searchconsole_
    reason: "Per-domain raw — superseded by gold.gsc_fact_site_impression"
  - prefix: analytics_
    reason: "Raw GA4 exports — superseded by gold.ga4_*"
  - prefix: google_ads_
    reason: "Raw Google Ads — superseded by gold.ad_fact_ads"
  - dataset: epic
    reason: "Epic EHR data — out of scope for v1 per closed-loop deck"
  - dataset: zbackup
    reason: "Backup tables"
