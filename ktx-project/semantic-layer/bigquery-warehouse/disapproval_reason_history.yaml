name: disapproval_reason_history
descriptions:
  user: Tracks historical disapproval reasons for Google Ads ad group criteria over time.
table: oh-data-warehouse.adwords_orlando_health.disapproval_reason_history
grain:
- ad_group_criterion_id
columns:
- name: ad_group_criterion_id
  type: number
  descriptions:
    ai: Unique identifier for the specific keyword or targeting criterion within an ad group.
- name: ad_group_id
  type: number
  descriptions:
    ai: Identifier of the ad group containing the disapproved criterion.
- name: sequence_id
  type: number
  descriptions:
    ai: Order index tracking multiple disapproval reasons for the same criterion.
- name: updated_at
  type: time
  descriptions:
    ai: Timestamp when the disapproval reason record was last updated in Google Ads.
  role: time
- name: _fivetran_synced
  type: time
  descriptions:
    ai: Timestamp when Fivetran last synced this record to the data warehouse.
  role: time
- name: disapproval_reason
  type: string
  descriptions:
    ai: Google Ads policy violation reason causing the criterion to be disapproved.
measures: []
