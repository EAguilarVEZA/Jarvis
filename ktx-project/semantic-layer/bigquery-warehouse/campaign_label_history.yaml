name: campaign_label_history
descriptions:
  user: Tracks historical associations between advertising campaigns and their assigned labels over time.
table: oh-data-warehouse.adwords_orlando_health.campaign_label_history
grain:
- campaign_id
columns:
- name: campaign_id
  type: number
  descriptions:
    ai: Unique identifier for the advertising campaign.
- name: label_id
  type: number
  descriptions:
    ai: Unique identifier for the label assigned to the campaign.
- name: updated_at
  type: time
  descriptions:
    ai: Timestamp when the campaign-label association was last modified.
  role: time
- name: _fivetran_synced
  type: time
  descriptions:
    ai: Timestamp when Fivetran last synced this record from the source.
  role: time
measures: []
