name: ad_stats
descriptions:
  user: Daily Google Ads performance metrics per ad, campaign, ad group, criterion, device, and network placement.
table: oh-data-warehouse.adwords_orlando_health.ad_stats
grain:
- _fivetran_id
columns:
- name: _fivetran_id
  type: string
  descriptions:
    ai: Unique row identifier generated by Fivetran for deduplication.
- name: customer_id
  type: number
  descriptions:
    ai: Internal Google Ads account identifier for the advertiser.
- name: date
  type: time
  descriptions:
    ai: Calendar date for which the performance metrics are reported.
  role: time
- name: _fivetran_synced
  type: time
  descriptions:
    ai: Timestamp of the most recent Fivetran data sync for this row.
  role: time
- name: active_view_impressions
  type: number
  descriptions:
    ai: Number of impressions measured as viewable by Active View.
- name: active_view_measurability
  type: number
  descriptions:
    ai: Percentage of impressions eligible for Active View measurement.
- name: active_view_measurable_cost
  type: number
  descriptions:
    ai: Cost attributed to Active View measurable impressions.
- name: active_view_measurable_impressions
  type: number
  descriptions:
    ai: Count of impressions that could be measured for viewability.
- name: active_view_viewability
  type: number
  descriptions:
    ai: Percentage of measurable impressions that were actually viewable.
- name: ad_group_id
  type: number
  descriptions:
    ai: Identifier for the ad group containing the ad.
- name: ad_network_type_1
  type: string
  descriptions:
    ai: Broad network category where the ad was served (e.g., Search, Display).
- name: ad_network_type_2
  type: string
  descriptions:
    ai: Specific network placement where the ad appeared.
- name: base_ad_group_id
  type: number
  descriptions:
    ai: Original ad group ID before any drafts or experiments.
- name: base_campaign_id
  type: number
  descriptions:
    ai: Original campaign ID before any drafts or experiments.
- name: campaign_id
  type: number
  descriptions:
    ai: Identifier for the campaign containing the ad.
- name: clicks
  type: number
  descriptions:
    ai: Total number of user clicks on the ad.
- name: conversion_value
  type: number
  descriptions:
    ai: Total monetary value attributed to recorded conversions.
- name: conversions
  type: number
  descriptions:
    ai: Number of conversion actions completed after ad interaction.
- name: cost
  type: number
  descriptions:
    ai: Total spend in account currency for the ad on this date.
- name: criterion_id
  type: number
  descriptions:
    ai: Identifier for the targeting criterion (e.g., keyword, audience).
- name: criterion_type
  type: string
  descriptions:
    ai: Type of targeting criterion such as Keyword or Age.
- name: device
  type: string
  descriptions:
    ai: Device category on which the ad was served.
- name: external_customer_id
  type: number
  descriptions:
    ai: Advertiser-facing Google Ads account ID shown in the UI.
- name: id
  type: number
  descriptions:
    ai: Unique identifier for the specific ad creative.
- name: impressions
  type: number
  descriptions:
    ai: Total number of times the ad was displayed.
- name: interaction_types
  type: string
  descriptions:
    ai: List of interaction types recorded, such as Clicks.
- name: interactions
  type: number
  descriptions:
    ai: Total count of user interactions with the ad.
- name: is_negative
  type: string
  descriptions:
    ai: Indicates whether the criterion is a negative targeting exclusion.
- name: slot
  type: string
  descriptions:
    ai: Position on the page where the ad appeared.
- name: view_through_conversions
  type: number
  descriptions:
    ai: Conversions from users who saw but did not click the ad.
measures:
- name: total_active_view_impressions
  expr: SUM(active_view_impressions)
  description: Active View Impressions (sum of active_view_impressions).
- name: total_active_view_measurability
  expr: SUM(active_view_measurability)
  description: Active View Measurability (sum of active_view_measurability).
- name: total_active_view_measurable_cost
  expr: SUM(active_view_measurable_cost)
  description: Active View Measurable Cost (sum of active_view_measurable_cost).
- name: total_active_view_measurable_impressions
  expr: SUM(active_view_measurable_impressions)
  description: Active View Measurable Impressions (sum of active_view_measurable_impressions).
- name: total_active_view_viewability
  expr: SUM(active_view_viewability)
  description: Active View Viewability (sum of active_view_viewability).
- name: total_clicks
  expr: SUM(clicks)
  description: Clicks (sum of clicks).
- name: total_conversion_value
  expr: SUM(conversion_value)
  description: Conversion Value (sum of conversion_value).
- name: total_conversions
  expr: SUM(conversions)
  description: Conversions (sum of conversions).
- name: total_cost
  expr: SUM(cost)
  description: Cost (sum of cost).
- name: total_impressions
  expr: SUM(impressions)
  description: Impressions (sum of impressions).
- name: total_interactions
  expr: SUM(interactions)
  description: Interactions (sum of interactions).
- name: total_view_through_conversions
  expr: SUM(view_through_conversions)
  description: View Through Conversions (sum of view_through_conversions).
