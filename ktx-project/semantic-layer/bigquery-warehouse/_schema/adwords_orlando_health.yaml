tables:
  campaign_conversion_optimizer_eligibility_history:
    table: oh-data-warehouse.adwords_orlando_health.campaign_conversion_optimizer_eligibility_history
    columns:
      - name: campaign_id
        type: number
        descriptions:
          ai: Unique identifier for the advertising campaign.
      - name: sequence_id
        type: number
        descriptions:
          ai: Order of eligibility status change events for a campaign.
      - name: updated_at
        type: time
        descriptions:
          ai: Timestamp when the eligibility status was last changed.
      - name: _fivetran_synced
        type: time
        descriptions:
          ai: Timestamp when Fivetran last synced this record.
      - name: is_eligible
        type: boolean
        descriptions:
          ai: Whether the campaign qualifies for conversion optimizer.
      - name: rejection_reason
        type: string
        descriptions:
          ai: Reason the campaign was denied conversion optimizer eligibility.
    descriptions:
      ai: Tracks historical eligibility status of campaigns for Google Ads conversion optimizer feature over time.
    joins:
      - to: campaign_dim_campaign
        "on": campaign_conversion_optimizer_eligibility_history.campaign_id = campaign_dim_campaign.campaign_id
        relationship: many_to_one
        source: inferred
  campaign_criterion_history:
    table: oh-data-warehouse.adwords_orlando_health.campaign_criterion_history
    columns:
      - name: campaign_id
        type: number
        descriptions:
          ai: Identifier of the Google Ads campaign this criterion belongs to.
      - name: id
        type: number
        descriptions:
          ai: Unique identifier for the campaign criterion record.
      - name: updated_at
        type: time
        descriptions:
          ai: Timestamp when this criterion record was last updated.
      - name: _fivetran_synced
        type: time
        descriptions:
          ai: Timestamp when Fivetran last synced this record.
      - name: ad_schedule_day_of_week
        type: string
        descriptions:
          ai: Day of week for ad scheduling targeting.
      - name: ad_schedule_end_hour
        type: number
        descriptions:
          ai: Hour when the ad schedule targeting window ends.
      - name: ad_schedule_end_minute
        type: string
        descriptions:
          ai: Minute when the ad schedule targeting window ends.
      - name: ad_schedule_start_hour
        type: number
        descriptions:
          ai: Hour when the ad schedule targeting window begins.
      - name: ad_schedule_start_minute
        type: string
        descriptions:
          ai: Minute when the ad schedule targeting window begins.
      - name: age_range_type
        type: string
        descriptions:
          ai: Targeted age range demographic segment.
      - name: base_campaign_id
        type: number
        descriptions:
          ai: Original campaign ID, relevant for draft or experiment campaigns.
      - name: bid_modifier
        type: number
        descriptions:
          ai: Multiplier adjusting bids for this criterion.
      - name: campaign_criterion_status
        type: string
        descriptions:
          ai: Active or paused status of this criterion.
      - name: campaign_criterion_type
        type: string
        descriptions:
          ai: Whether criterion is a positive target or negative exclusion.
      - name: carrier_country_code
        type: string
        descriptions:
          ai: Country code of the mobile carrier being targeted.
      - name: carrier_name
        type: string
        descriptions:
          ai: Name of the mobile carrier being targeted.
      - name: content_label_type
        type: string
        descriptions:
          ai: Type of content label excluded from ad serving.
      - name: criterion_type
        type: string
        descriptions:
          ai: Category of targeting criterion such as Location, Keyword, or Platform.
      - name: gender_type
        type: string
        descriptions:
          ai: Targeted gender demographic segment.
      - name: income_range_type
        type: string
        descriptions:
          ai: Targeted household income range segment.
      - name: ip_block_ip_address
        type: string
        descriptions:
          ai: IP address blocked from seeing ads.
      - name: is_negative
        type: boolean
        descriptions:
          ai: Indicates whether this criterion is an exclusion rather than inclusion.
      - name: keyword_match_type
        type: string
        descriptions:
          ai: "Match type for keyword targeting: broad, phrase, or exact."
      - name: keyword_text
        type: string
        descriptions:
          ai: The keyword text used for targeting or exclusion.
      - name: language_code
        type: string
        descriptions:
          ai: ISO code of the targeted language.
      - name: language_name
        type: string
        descriptions:
          ai: Human-readable name of the targeted language.
      - name: location_display_type
        type: string
        descriptions:
          ai: Geographic level of the location such as Country or City.
      - name: location_name
        type: string
        descriptions:
          ai: Name of the targeted geographic location.
      - name: location_parent_locations
        type: string
        descriptions:
          ai: Parent geographic locations containing the targeted location.
      - name: location_targeting_status
        type: string
        descriptions:
          ai: Availability status of the targeted location.
      - name: mobile_app_category_id
        type: number
        descriptions:
          ai: Identifier for the targeted mobile app category.
      - name: mobile_app_display_name
        type: string
        descriptions:
          ai: Display name of the targeted mobile app category.
      - name: mobile_application_app_id
        type: string
        descriptions:
          ai: Store identifier of the targeted mobile application.
      - name: mobile_application_display_name
        type: string
        descriptions:
          ai: Display name of the targeted mobile application.
      - name: mobile_device_manufacturer_name
        type: string
        descriptions:
          ai: Manufacturer of the targeted mobile device.
      - name: mobile_device_name
        type: string
        descriptions:
          ai: Model name of the targeted mobile device.
      - name: mobile_device_operating_system_name
        type: string
        descriptions:
          ai: Operating system of the targeted mobile device.
      - name: mobile_device_type
        type: string
        descriptions:
          ai: Type classification of the targeted mobile device.
      - name: operating_system_name
        type: string
        descriptions:
          ai: Name of the targeted device operating system.
      - name: operating_system_operator_type
        type: string
        descriptions:
          ai: Comparison operator for OS version targeting.
      - name: operating_system_os_major_version
        type: number
        descriptions:
          ai: Major version number of the targeted operating system.
      - name: operating_system_os_minor_version
        type: number
        descriptions:
          ai: Minor version number of the targeted operating system.
      - name: parent_type
        type: string
        descriptions:
          ai: Parental status demographic segment being targeted.
      - name: placement_url
        type: string
        descriptions:
          ai: Website URL targeted or excluded as a placement.
      - name: platform_name
        type: string
        descriptions:
          ai: Platform targeted such as desktop or high-end mobile.
      - name: proximity_address_street_address
        type: string
        descriptions:
          ai: Primary street address for proximity radius targeting.
      - name: proximity_address_street_address_2
        type: string
        descriptions:
          ai: Secondary street address line for proximity targeting.
      - name: proximity_city_name
        type: string
        descriptions:
          ai: City of the proximity targeting center point.
      - name: proximity_country_code
        type: string
        descriptions:
          ai: Country code of the proximity targeting center point.
      - name: proximity_geo_point_latitude_in_micro_degrees
        type: number
        descriptions:
          ai: Latitude in micro-degrees for proximity targeting center.
      - name: proximity_geo_point_longitude_in_micro_degrees
        type: number
        descriptions:
          ai: Longitude in micro-degrees for proximity targeting center.
      - name: proximity_postal_code
        type: string
        descriptions:
          ai: Postal code of the proximity targeting center point.
      - name: proximity_province_code
        type: string
        descriptions:
          ai: Province or state code for proximity targeting.
      - name: proximity_province_name
        type: string
        descriptions:
          ai: Province or state name for proximity targeting.
      - name: proximity_radius_distance_units
        type: string
        descriptions:
          ai: Unit of measurement for the proximity targeting radius.
      - name: proximity_radius_in_units
        type: number
        descriptions:
          ai: Radius size for proximity geographic targeting.
      - name: user_interest_id
        type: number
        descriptions:
          ai: Identifier of the targeted user interest audience segment.
      - name: user_interest_name
        type: string
        descriptions:
          ai: Name of the targeted user interest audience segment.
      - name: user_interest_parent_id
        type: number
        descriptions:
          ai: Parent category identifier for the user interest segment.
      - name: user_list_eligible_for_display
        type: boolean
        descriptions:
          ai: Indicates if the user list can be used for display campaigns.
      - name: user_list_eligible_for_search
        type: boolean
        descriptions:
          ai: Indicates if the user list can be used for search campaigns.
      - name: user_list_id
        type: number
        descriptions:
          ai: Identifier of the targeted remarketing user list.
      - name: user_list_membership_status
        type: string
        descriptions:
          ai: Whether the user list is open or closed for membership.
      - name: user_list_name
        type: string
        descriptions:
          ai: Name of the targeted remarketing user list.
      - name: vertical_id
        type: number
        descriptions:
          ai: Identifier of the targeted content vertical category.
      - name: vertical_parent_id
        type: number
        descriptions:
          ai: Parent category identifier for the content vertical.
      - name: vertical_path
        type: string
        descriptions:
          ai: Full hierarchical path of the targeted content vertical.
      - name: youtube_channel_id
        type: string
        descriptions:
          ai: Identifier of the targeted or excluded YouTube channel.
      - name: youtube_channel_name
        type: string
        descriptions:
          ai: Name of the targeted or excluded YouTube channel.
      - name: youtube_video_id
        type: string
        descriptions:
          ai: Identifier of the targeted or excluded YouTube video.
      - name: youtube_video_name
        type: string
        descriptions:
          ai: Title of the targeted or excluded YouTube video.
    descriptions:
      ai: Historical record of targeting criteria applied to Google Ads campaigns, including inclusions and exclusions.
    joins:
      - to: campaign_dim_campaign
        "on": campaign_criterion_history.base_campaign_id = campaign_dim_campaign.campaign_id
        relationship: many_to_one
        source: inferred
      - to: campaign_dim_campaign
        "on": campaign_criterion_history.campaign_id = campaign_dim_campaign.campaign_id
        relationship: many_to_one
        source: inferred
      - to: location
        "on": campaign_criterion_history.campaign_id = location.campaign_id AND campaign_criterion_history.id = location.id
        relationship: one_to_many
        source: inferred
  campaign_geo_target_type_setting_history:
    table: oh-data-warehouse.adwords_orlando_health.campaign_geo_target_type_setting_history
    columns:
      - name: campaign_id
        type: number
        descriptions:
          ai: Unique identifier linking the record to a specific advertising campaign.
      - name: updated_at
        type: time
        descriptions:
          ai: Timestamp when the geo targeting setting was last modified in the source system.
      - name: _fivetran_synced
        type: time
        descriptions:
          ai: Timestamp when Fivetran last synced this record to the data warehouse.
      - name: negative_geo_target_type
        type: string
        descriptions:
          ai: Criteria for excluding users based on location presence or interest.
      - name: positive_geo_target_type
        type: string
        descriptions:
          ai: Criteria for including users based on location presence, interest, or no preference.
    descriptions:
      ai: Historical record of geographic targeting type settings for advertising campaigns over time.
    joins:
      - to: campaign_dim_campaign
        "on": campaign_geo_target_type_setting_history.campaign_id = campaign_dim_campaign.campaign_id
        relationship: many_to_one
        source: inferred
  campaign_history:
    table: oh-data-warehouse.adwords_orlando_health.campaign_history
    columns:
      - name: id
        type: number
        descriptions:
          ai: Unique Google Ads campaign identifier.
      - name: updated_at
        type: time
        descriptions:
          ai: Timestamp when the campaign record was last modified.
      - name: _fivetran_synced
        type: time
        descriptions:
          ai: Timestamp when Fivetran last synced this record.
      - name: ad_serving_optimization_status
        type: string
        descriptions:
          ai: Controls how Google optimizes ad serving within the campaign.
      - name: advertising_channel_subtype
        type: string
        descriptions:
          ai: More specific sub-classification of the advertising channel.
      - name: advertising_channel_type
        type: string
        descriptions:
          ai: Primary channel type, e.g., SEARCH or DISPLAY.
      - name: base_campaign_id
        type: number
        descriptions:
          ai: ID of the original campaign if this is a trial variant.
      - name: bidding_strategy_bid_ceiling
        type: number
        descriptions:
          ai: Maximum bid cap allowed by the bidding strategy.
      - name: bidding_strategy_bid_changes_for_raises_only
        type: boolean
        descriptions:
          ai: Restricts automated bid adjustments to increases only.
      - name: bidding_strategy_bid_floor
        type: number
        descriptions:
          ai: Minimum bid floor set by the bidding strategy.
      - name: bidding_strategy_bid_modifier
        type: number
        descriptions:
          ai: Multiplier applied to adjust bids automatically.
      - name: bidding_strategy_competitor_domain
        type: string
        descriptions:
          ai: Competitor domain targeted for outranking bid strategies.
      - name: bidding_strategy_cpa_bid_amount
        type: number
        descriptions:
          ai: Target cost-per-acquisition bid amount in micros.
      - name: bidding_strategy_cpc_bid_amount
        type: number
        descriptions:
          ai: Target cost-per-click bid amount in micros.
      - name: bidding_strategy_cpm_bid_amount
        type: number
        descriptions:
          ai: Target cost-per-thousand-impressions bid amount in micros.
      - name: bidding_strategy_enhanced_cpc_enabled
        type: boolean
        descriptions:
          ai: Indicates if enhanced CPC bid adjustment is active.
      - name: bidding_strategy_id
        type: number
        descriptions:
          ai: Identifier of the shared portfolio bidding strategy applied.
      - name: bidding_strategy_max_cpc_bid_ceiling
        type: number
        descriptions:
          ai: Upper CPC bid ceiling within the bidding strategy.
      - name: bidding_strategy_max_cpc_bid_floor
        type: number
        descriptions:
          ai: Lower CPC bid floor within the bidding strategy.
      - name: bidding_strategy_name
        type: string
        descriptions:
          ai: Human-readable name of the applied bidding strategy.
      - name: bidding_strategy_raise_bid_when_budget_constrained
        type: boolean
        descriptions:
          ai: Allows bid increases when campaign is budget-limited.
      - name: bidding_strategy_raise_bid_when_low_quality_score
        type: boolean
        descriptions:
          ai: Allows bid increases for low quality score keywords.
      - name: bidding_strategy_scheme_type
        type: string
        descriptions:
          ai: Classification scheme of the bidding strategy approach.
      - name: bidding_strategy_source
        type: string
        descriptions:
          ai: Indicates whether strategy is campaign-level or portfolio-level.
      - name: bidding_strategy_spend_target
        type: number
        descriptions:
          ai: Target spend amount for budget-based bidding strategies.
      - name: bidding_strategy_strategy_goal
        type: string
        descriptions:
          ai: Primary optimization goal of the bidding strategy.
      - name: bidding_strategy_target_cpa
        type: number
        descriptions:
          ai: Desired cost per acquisition for Target CPA strategy.
      - name: bidding_strategy_target_outrank_share
        type: number
        descriptions:
          ai: Share of auctions where campaign should outrank competitors.
      - name: bidding_strategy_target_roas
        type: number
        descriptions:
          ai: Desired return on ad spend ratio for Target ROAS.
      - name: bidding_strategy_target_roas_override
        type: number
        descriptions:
          ai: Campaign-level override for the portfolio target ROAS value.
      - name: bidding_strategy_type
        type: string
        descriptions:
          ai: Type of bidding strategy, e.g., TARGET_CPA or MANUAL_CPC.
      - name: bidding_strategy_viewable_cpm_enabled
        type: boolean
        descriptions:
          ai: Indicates if viewable CPM bidding is enabled.
      - name: campaign_group_id
        type: number
        descriptions:
          ai: ID of the campaign group this campaign belongs to.
      - name: campaign_trial_type
        type: string
        descriptions:
          ai: Indicates if campaign is a BASE or experimental trial.
      - name: customer_id
        type: number
        descriptions:
          ai: Google Ads account identifier owning this campaign.
      - name: end_date
        type: string
        descriptions:
          ai: Scheduled end date of the campaign in YYYYMMDD format.
      - name: final_url_suffix
        type: string
        descriptions:
          ai: Parameters appended to landing page URLs for tracking.
      - name: frequency_cap_impressions
        type: number
        descriptions:
          ai: Maximum impressions allowed per user within the time unit.
      - name: frequency_cap_level
        type: string
        descriptions:
          ai: Level at which frequency cap is applied, e.g., ad group.
      - name: frequency_cap_time_unit
        type: string
        descriptions:
          ai: Time period for the frequency cap, e.g., DAY or WEEK.
      - name: name
        type: string
        descriptions:
          ai: Descriptive display name of the campaign.
      - name: network_setting_target_content_network
        type: boolean
        descriptions:
          ai: Enables serving ads on Google Display Network.
      - name: network_setting_target_google_search
        type: boolean
        descriptions:
          ai: Enables serving ads on Google Search results.
      - name: network_setting_target_partner_search_network
        type: boolean
        descriptions:
          ai: Enables serving ads on Google search partner sites.
      - name: network_setting_target_search_network
        type: boolean
        descriptions:
          ai: Enables serving ads on Google Search Network.
      - name: serving_status
        type: string
        descriptions:
          ai: Current delivery status, e.g., SERVING or ENDED.
      - name: start_date
        type: string
        descriptions:
          ai: Campaign launch date in YYYYMMDD format.
      - name: status
        type: string
        descriptions:
          ai: "Administrative status: ENABLED, PAUSED, or REMOVED."
      - name: tracking_url_template
        type: string
        descriptions:
          ai: URL template used for click tracking across ads.
      - name: vanity_pharma_display_url_mode
        type: string
        descriptions:
          ai: Display URL mode for pharmaceutical vanity URL compliance.
      - name: vanity_pharma_text
        type: string
        descriptions:
          ai: Approved vanity text shown in pharma ad display URLs.
    descriptions:
      ai: Historical snapshot of Google Ads campaign configurations, settings, and bidding strategies per customer.
    joins:
      - to: campaign_dim_campaign
        "on": campaign_history.base_campaign_id = campaign_dim_campaign.campaign_id
        relationship: many_to_one
        source: inferred
      - to: campaign_dim_customer
        "on": campaign_history.customer_id = campaign_dim_customer.customer_id
        relationship: many_to_one
        source: inferred
  campaign_label_history:
    table: oh-data-warehouse.adwords_orlando_health.campaign_label_history
    columns:
      - name: campaign_id
        type: number
        descriptions:
          ai: Unique identifier for the advertising campaign.
      - name: label_id
        type: number
        descriptions:
          ai: Unique identifier for the label assigned to the campaign.
      - name: updated_at
        type: time
        descriptions:
          ai: Timestamp when the campaign-label association was last modified.
      - name: _fivetran_synced
        type: time
        descriptions:
          ai: Timestamp when Fivetran last synced this record from the source.
    descriptions:
      ai: Tracks historical associations between advertising campaigns and their assigned labels over time.
    joins:
      - to: campaign_dim_campaign
        "on": campaign_label_history.campaign_id = campaign_dim_campaign.campaign_id
        relationship: many_to_one
        source: inferred
      - to: label
        "on": campaign_label_history.label_id = label.id
        relationship: many_to_one
        source: inferred
  campaign_targeting_setting_history:
    table: oh-data-warehouse.adwords_orlando_health.campaign_targeting_setting_history
    columns:
      - name: campaign_id
        type: number
        descriptions:
          ai: Unique identifier linking the record to a specific ad campaign.
      - name: sequence_id
        type: number
        descriptions:
          ai: Version number indicating the order of changes for this campaign setting.
      - name: updated_at
        type: time
        descriptions:
          ai: Timestamp when the targeting setting was last modified in the source system.
      - name: _fivetran_synced
        type: time
        descriptions:
          ai: Timestamp when Fivetran last synced this record to the data warehouse.
      - name: criterion_type_group
        type: string
        descriptions:
          ai: Category of targeting criteria applied, such as audience interest or remarketing lists.
      - name: target_all
        type: boolean
        descriptions:
          ai: Indicates whether the campaign targets all users within the criterion group.
    descriptions:
      ai: Tracks historical changes to campaign targeting settings, including audience criterion configurations over time.
    joins:
      - to: campaign_dim_campaign
        "on": campaign_targeting_setting_history.campaign_id = campaign_dim_campaign.campaign_id
        relationship: many_to_one
        source: inferred
  account:
    table: oh-data-warehouse.adwords_orlando_health.account
    columns:
      - name: id
        type: number
        descriptions:
          ai: Unique Google Ads customer account identifier.
      - name: sequence_id
        type: number
        descriptions:
          ai: Ordering sequence for record versioning or deduplication.
      - name: _fivetran_synced
        type: time
        descriptions:
          ai: Timestamp of the last Fivetran sync for this record.
      - name: account_label_id
        type: number
        descriptions:
          ai: Numeric identifier of the label assigned to this account.
      - name: account_label_name
        type: string
        descriptions:
          ai: Display name of the label assigned to this account.
      - name: can_manage_clients
        type: boolean
        descriptions:
          ai: Indicates whether this account has manager-level client access.
      - name: currency_code
        type: string
        descriptions:
          ai: ISO currency code used for billing and reporting.
      - name: date_timezone
        type: string
        descriptions:
          ai: Timezone used for date-based reporting and scheduling.
      - name: manager_customer_id
        type: number
        descriptions:
          ai: Parent manager account ID if this is a sub-account.
      - name: name
        type: string
        descriptions:
          ai: Business or brand name of the advertising account.
      - name: test_account
        type: boolean
        descriptions:
          ai: Flags whether this is a test account, not real spend.
    descriptions:
      ai: Google Ads accounts synced via Fivetran, representing advertiser or manager account configurations.
    joins:
      - to: ad_dim_account
        "on": account.currency_code = ad_dim_account.customer_currency_code
        relationship: one_to_many
        source: inferred
      - to: campaign_dim_customer
        "on": account.currency_code = campaign_dim_customer.customer_currency_code
        relationship: one_to_many
        source: inferred
  ad_group_criterion_history:
    table: oh-data-warehouse.adwords_orlando_health.ad_group_criterion_history
    columns:
      - name: ad_group_id
        type: number
        descriptions:
          ai: Identifier of the ad group this criterion belongs to.
      - name: id
        type: number
        descriptions:
          ai: Unique identifier for the ad group criterion.
      - name: updated_at
        type: time
        descriptions:
          ai: Timestamp when this criterion record was last updated.
      - name: _fivetran_synced
        type: time
        descriptions:
          ai: Timestamp when Fivetran last synced this record.
      - name: ad_group_criterion_type
        type: string
        descriptions:
          ai: Whether criterion is biddable or negative targeting.
      - name: age_range_type
        type: string
        descriptions:
          ai: Age range demographic targeting segment.
      - name: app_id
        type: string
        descriptions:
          ai: App store identifier for app-based targeting criteria.
      - name: app_payment_model_type
        type: string
        descriptions:
          ai: Payment model type for app targeting (free or paid).
      - name: approval_status
        type: string
        descriptions:
          ai: Google's editorial approval status for this criterion.
      - name: base_adgroup_id
        type: number
        descriptions:
          ai: Original ad group ID for draft or experiment ad groups.
      - name: base_campaign_id
        type: number
        descriptions:
          ai: Original campaign ID for draft or experiment campaigns.
      - name: bid_modifier
        type: number
        descriptions:
          ai: Multiplier adjusting bids for this criterion.
      - name: bidding_strategy_bid_ceiling
        type: number
        descriptions:
          ai: Maximum bid cap allowed by the bidding strategy.
      - name: bidding_strategy_bid_changes_for_raises_only
        type: boolean
        descriptions:
          ai: Restricts automated bid changes to increases only.
      - name: bidding_strategy_bid_floor
        type: number
        descriptions:
          ai: Minimum bid floor set by the bidding strategy.
      - name: bidding_strategy_bid_modifier
        type: number
        descriptions:
          ai: Bid adjustment multiplier within the bidding strategy.
      - name: bidding_strategy_competitor_domain
        type: string
        descriptions:
          ai: Competitor domain targeted for outranking share strategy.
      - name: bidding_strategy_cpa_bid_amount
        type: number
        descriptions:
          ai: Target cost-per-acquisition bid amount in micros.
      - name: bidding_strategy_cpc_bid_amount
        type: number
        descriptions:
          ai: Cost-per-click bid amount in micros.
      - name: bidding_strategy_cpm_bid_amount
        type: number
        descriptions:
          ai: Cost-per-thousand-impressions bid amount in micros.
      - name: bidding_strategy_enhanced_cpc_enabled
        type: boolean
        descriptions:
          ai: Whether enhanced CPC bid optimization is enabled.
      - name: bidding_strategy_id
        type: number
        descriptions:
          ai: Identifier of the shared portfolio bidding strategy.
