tables:
  campaign_dim_ad:
    table: oh-data-warehouse.gold.campaign_dim_ad
    columns:
      - name: ad_id
        type: number
        descriptions:
          ai: Unique identifier for the individual ad creative.
      - name: ad_group_id
        type: number
        descriptions:
          ai: Identifier of the ad group containing this ad.
      - name: campaign_id
        type: number
        descriptions:
          ai: Identifier of the campaign this ad belongs to.
      - name: customer_id
        type: number
        descriptions:
          ai: Google Ads account identifier owning this ad.
      - name: ad_group_ad_ad_added_by_google_ads
        type: boolean
        descriptions:
          ai: Indicates if Google automatically created this ad.
      - name: ad_group_ad_ad_app_ad_descriptions
        type: string
        descriptions:
          ai: Description text assets for app promotion ads.
      - name: ad_group_ad_ad_app_ad_headlines
        type: string
        descriptions:
          ai: Headline text assets for app promotion ads.
      - name: ad_group_ad_ad_app_ad_html5_media_bundles
        type: string
        descriptions:
          ai: HTML5 media bundle assets for app ads.
      - name: ad_group_ad_ad_app_ad_images
        type: string
        descriptions:
          ai: Image assets used in app promotion ads.
      - name: ad_group_ad_ad_app_ad_mandatory_ad_text
        type: string
        descriptions:
          ai: Required text element for app promotion ads.
      - name: ad_group_ad_ad_app_ad_youtube_videos
        type: string
        descriptions:
          ai: YouTube video assets linked to app ads.
      - name: ad_group_ad_ad_call_ad_phone_number
        type: string
        descriptions:
          ai: Phone number displayed in call-only ads.
      - name: ad_group_ad_ad_device_preference
        type: string
        descriptions:
          ai: Preferred device targeting for ad delivery.
      - name: ad_group_ad_ad_display_url
        type: string
        descriptions:
          ai: Visible URL shown to users in the ad.
      - name: ad_group_ad_ad_expanded_dynamic_search_ad_description
        type: string
        descriptions:
          ai: Primary description for dynamic search ads.
      - name: ad_group_ad_ad_expanded_dynamic_search_ad_description2
        type: string
        descriptions:
          ai: Secondary description for dynamic search ads.
      - name: ad_group_ad_ad_expanded_text_ad_description
        type: string
        descriptions:
          ai: Primary description line for expanded text ads.
      - name: ad_group_ad_ad_expanded_text_ad_description2
        type: string
        descriptions:
          ai: Secondary description line for expanded text ads.
      - name: ad_group_ad_ad_expanded_text_ad_headline_part1
        type: string
        descriptions:
          ai: First headline segment of expanded text ads.
      - name: ad_group_ad_ad_expanded_text_ad_headline_part2
        type: string
        descriptions:
          ai: Second headline segment of expanded text ads.
      - name: ad_group_ad_ad_expanded_text_ad_headline_part3
        type: string
        descriptions:
          ai: Third headline segment of expanded text ads.
      - name: ad_group_ad_ad_expanded_text_ad_path1
        type: string
        descriptions:
          ai: First URL path appended to display URL.
      - name: ad_group_ad_ad_expanded_text_ad_path2
        type: string
        descriptions:
          ai: Second URL path appended to display URL.
      - name: ad_group_ad_ad_final_app_urls
        type: string
        descriptions:
          ai: Landing URLs for app store destinations.
      - name: ad_group_ad_ad_final_mobile_urls
        type: string
        descriptions:
          ai: Landing URLs specifically for mobile users.
      - name: ad_group_ad_ad_final_urls
        type: string
        descriptions:
          ai: Primary destination URLs users land on after clicking.
      - name: ad_group_ad_ad_group
        type: string
        descriptions:
          ai: Resource name path of the parent ad group.
      - name: ad_group_ad_ad_image_ad_image_url
        type: string
        descriptions:
          ai: Hosted URL of the image ad creative.
      - name: ad_group_ad_ad_image_ad_mime_type
        type: string
        descriptions:
          ai: File format type of the image ad.
      - name: ad_group_ad_ad_image_ad_name
        type: string
        descriptions:
          ai: Filename or label assigned to the image ad.
      - name: ad_group_ad_ad_image_ad_pixel_height
        type: number
        descriptions:
          ai: Height of the image ad in pixels.
      - name: ad_group_ad_ad_image_ad_pixel_width
        type: number
        descriptions:
          ai: Width of the image ad in pixels.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_accent_color
        type: string
        descriptions:
          ai: Accent color used in legacy responsive display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_allow_flexible_color
        type: boolean
        descriptions:
          ai: Permits Google to adjust colors in legacy display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_business_name
        type: string
        descriptions:
          ai: Advertiser business name in legacy display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_call_to_action_text
        type: string
        descriptions:
          ai: CTA button text for legacy responsive display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_description
        type: string
        descriptions:
          ai: Body description text for legacy responsive display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_format_setting
        type: string
        descriptions:
          ai: Layout format preference for legacy display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_logo_image
        type: string
        descriptions:
          ai: Logo image asset for legacy responsive display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_long_headline
        type: string
        descriptions:
          ai: Long headline text for legacy responsive display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_main_color
        type: string
        descriptions:
          ai: Primary brand color for legacy responsive display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_marketing_image
        type: string
        descriptions:
          ai: Main marketing image for legacy display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_price_prefix
        type: string
        descriptions:
          ai: Price prefix text shown in legacy display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_promo_text
        type: string
        descriptions:
          ai: Promotional text shown in legacy display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_short_headline
        type: string
        descriptions:
          ai: Short headline for legacy responsive display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_square_logo_image
        type: string
        descriptions:
          ai: Square-format logo for legacy display ads.
      - name: ad_group_ad_ad_legacy_responsive_display_ad_square_marketing_image
        type: string
        descriptions:
          ai: Square marketing image for legacy display ads.
      - name: ad_group_ad_ad_name
        type: string
        descriptions:
          ai: Human-readable label assigned to the ad creative.
      - name: ad_group_ad_ad_responsive_display_ad_accent_color
        type: string
        descriptions:
          ai: Accent color for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_business_name
        type: string
        descriptions:
          ai: Advertiser business name in responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_call_to_action_text
        type: string
        descriptions:
          ai: CTA button text for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_descriptions
        type: string
        descriptions:
          ai: Description text assets for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_format_setting
        type: string
        descriptions:
          ai: Layout format preference for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_headlines
        type: string
        descriptions:
          ai: Headline assets for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_logo_images
        type: string
        descriptions:
          ai: Logo image assets for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_long_headline
        type: string
        descriptions:
          ai: Long headline asset for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_main_color
        type: string
        descriptions:
          ai: Primary brand color for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_marketing_images
        type: string
        descriptions:
          ai: Main marketing images for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_price_prefix
        type: string
        descriptions:
          ai: Price prefix text for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_promo_text
        type: string
        descriptions:
          ai: Promotional text shown in responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_square_logo_images
        type: string
        descriptions:
          ai: Square logo images for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_square_marketing_images
        type: string
        descriptions:
          ai: Square marketing images for responsive display ads.
      - name: ad_group_ad_ad_responsive_display_ad_youtube_videos
        type: string
        descriptions:
          ai: YouTube video assets for responsive display ads.
      - name: ad_group_ad_ad_responsive_search_ad_descriptions
        type: string
        descriptions:
          ai: Description assets for responsive search ads.
      - name: ad_group_ad_ad_responsive_search_ad_headlines
        type: string
        descriptions:
          ai: Headline assets for responsive search ads.
      - name: ad_group_ad_ad_responsive_search_ad_path1
        type: string
        descriptions:
          ai: First display URL path for responsive search ads.
      - name: ad_group_ad_ad_responsive_search_ad_path2
        type: string
        descriptions:
          ai: Second display URL path for responsive search ads.
      - name: ad_group_ad_ad_strength
        type: string
        descriptions:
          ai: Google's quality rating of the ad creative.
      - name: ad_group_ad_ad_system_managed_resource_source
        type: string
        descriptions:
          ai: Source system that auto-generated this ad resource.
      - name: ad_group_ad_ad_text_ad_description1
        type: string
        descriptions:
          ai: First description line for standard text ads.
      - name: ad_group_ad_ad_text_ad_description2
        type: string
        descriptions:
          ai: Second description line for standard text ads.
      - name: ad_group_ad_ad_text_ad_headline
        type: string
        descriptions:
          ai: Headline text for standard text ads.
      - name: ad_group_ad_ad_tracking_url_template
        type: string
        descriptions:
          ai: URL template for tracking ad click parameters.
      - name: ad_group_ad_ad_type
        type: string
        descriptions:
          ai: Format category of the ad creative.
      - name: ad_group_ad_ad_url_custom_parameters
        type: string
        descriptions:
          ai: Custom key-value pairs appended to tracking URLs.
      - name: ad_group_ad_policy_summary_approval_status
        type: string
        descriptions:
          ai: Google policy review outcome for the ad.
      - name: ad_group_ad_status
        type: string
        descriptions:
          ai: Current serving status of the ad.
    descriptions:
      ai: Google Ads dimension table storing ad creative details across all ad types within campaigns and ad groups.
    joins:
      - to: ad_policy_evidence_history
        "on": campaign_dim_ad.ad_id = ad_policy_evidence_history.policy_topic_ad_id
        relationship: one_to_many
        source: inferred
      - to: campaign_dim_adgroup
        "on": campaign_dim_ad.ad_group_id = campaign_dim_adgroup.ad_group_id
        relationship: many_to_one
        source: inferred
      - to: ad_dim_ad
        "on": campaign_dim_ad.ad_id = ad_dim_ad.ad_id
        relationship: many_to_one
        source: inferred
      - to: campaign_dim_campaign
        "on": campaign_dim_ad.campaign_id = campaign_dim_campaign.campaign_id
        relationship: many_to_one
        source: inferred
      - to: campaign_dim_customer
        "on": campaign_dim_ad.customer_id = campaign_dim_customer.customer_id
        relationship: many_to_one
        source: inferred
  campaign_dim_adgroup:
    table: oh-data-warehouse.gold.campaign_dim_adgroup
    columns:
      - name: ad_group_id
        type: number
        descriptions:
          ai: Unique identifier for the ad group.
      - name: campaign_id
        type: number
        descriptions:
          ai: Parent campaign this ad group belongs to.
      - name: customer_id
        type: number
        descriptions:
          ai: Google Ads account owner of this ad group.
      - name: ad_group_ad_rotation_mode
        type: string
        descriptions:
          ai: How ads within the group are rotated for serving.
      - name: ad_group_cpc_bid_micros
        type: number
        descriptions:
          ai: Cost-per-click bid amount in micros (millionths of currency unit).
      - name: ad_group_cpm_bid_micros
        type: number
        descriptions:
          ai: Cost-per-thousand-impressions bid in micros.
      - name: ad_group_cpv_bid_micros
        type: number
        descriptions:
          ai: Cost-per-view bid in micros for video ads.
      - name: ad_group_display_custom_bid_dimension
        type: string
        descriptions:
          ai: Custom bid dimension used for display network targeting.
      - name: ad_group_effective_target_cpa_micros
        type: number
        descriptions:
          ai: Resolved target cost-per-acquisition in micros.
      - name: ad_group_effective_target_cpa_source
        type: string
        descriptions:
          ai: Origin of the effective CPA target value.
      - name: ad_group_effective_target_roas
        type: number
        descriptions:
          ai: Resolved target return on ad spend ratio.
      - name: ad_group_effective_target_roas_source
        type: string
        descriptions:
          ai: Origin of the effective ROAS target value.
      - name: ad_group_name
        type: string
        descriptions:
          ai: Human-readable label assigned to the ad group.
      - name: ad_group_status
        type: string
        descriptions:
          ai: "Current serving state: ENABLED, PAUSED, or REMOVED."
      - name: ad_group_tracking_url_template
        type: string
        descriptions:
          ai: URL template for tracking ad group click traffic.
      - name: ad_group_type
        type: string
        descriptions:
          ai: Ad group format type, e.g., SEARCH_STANDARD or DISPLAY_STANDARD.
      - name: ad_group_url_custom_parameters
        type: string
        descriptions:
          ai: Custom key-value parameters appended to destination URLs.
      - name: campaign_bidding_strategy
        type: string
        descriptions:
          ai: Resource path of the portfolio bidding strategy applied.
      - name: campaign_bidding_strategy_type
        type: string
        descriptions:
          ai: Bidding strategy type, e.g., MANUAL_CPC or TARGET_SPEND.
      - name: campaign_manual_cpc_enhanced_cpc_enabled
        type: boolean
        descriptions:
          ai: Whether enhanced CPC is active for manual CPC campaigns.
      - name: campaign_percent_cpc_enhanced_cpc_enabled
        type: boolean
        descriptions:
          ai: Whether enhanced CPC is active for percent CPC campaigns.
    descriptions:
      ai: Dimension table storing Google Ads ad group configuration and bidding settings linked to campaigns and customers.
    joins:
      - to: ad_stats
        "on": campaign_dim_adgroup.ad_group_id = ad_stats.base_ad_group_id
        relationship: one_to_many
        source: inferred
      - to: campaign_dim_ad
        "on": campaign_dim_adgroup.ad_group_id = campaign_dim_ad.ad_group_id
        relationship: one_to_many
        source: inferred
      - to: campaign_dim_campaign
        "on": campaign_dim_adgroup.campaign_id = campaign_dim_campaign.campaign_id
        relationship: many_to_one
        source: inferred
      - to: campaign_dim_customer
        "on": campaign_dim_adgroup.customer_id = campaign_dim_customer.customer_id
        relationship: many_to_one
        source: inferred
  campaign_dim_customer:
    table: oh-data-warehouse.gold.campaign_dim_customer
    columns:
      - name: customer_id
        type: number
        descriptions:
          ai: Unique Google Ads account identifier.
      - name: customer_auto_tagging_enabled
        type: boolean
        descriptions:
          ai: Indicates if URL auto-tagging for tracking is active on the account.
      - name: customer_currency_code
        type: string
        descriptions:
          ai: Currency used for billing and reporting within the account.
      - name: customer_descriptive_name
        type: string
        descriptions:
          ai: Human-readable display name identifying the advertiser account.
      - name: customer_manager
        type: boolean
        descriptions:
          ai: Indicates if this account is a manager (MCC) account overseeing others.
      - name: customer_test_account
        type: boolean
        descriptions:
          ai: Flags whether the account is used for testing purposes only.
      - name: customer_time_zone
        type: string
        descriptions:
          ai: Account's local time zone governing ad scheduling and reporting.
    descriptions:
      ai: Dimension table storing Google Ads customer account attributes used for campaign reporting and segmentation.
    joins:
      - to: ad_stats
        "on": campaign_dim_customer.customer_id = ad_stats.customer_id
        relationship: one_to_many
        source: inferred
      - to: ad_stats
        "on": campaign_dim_customer.customer_id = ad_stats.external_customer_id
        relationship: one_to_many
        source: inferred
      - to: campaign_history
        "on": campaign_dim_customer.customer_id = campaign_history.customer_id
        relationship: one_to_many
        source: inferred
      - to: keyword_stats
        "on": campaign_dim_customer.customer_id = keyword_stats.customer_id
        relationship: one_to_many
        source: inferred
      - to: keyword_stats
        "on": campaign_dim_customer.customer_id = keyword_stats.external_customer_id
        relationship: one_to_many
        source: inferred
      - to: campaign_dim_ad
        "on": campaign_dim_customer.customer_id = campaign_dim_ad.customer_id
        relationship: one_to_many
        source: inferred
      - to: campaign_dim_adgroup
        "on": campaign_dim_customer.customer_id = campaign_dim_adgroup.customer_id
        relationship: one_to_many
        source: inferred
      - to: campaign_dim_campaign
        "on": campaign_dim_customer.customer_id = campaign_dim_campaign.customer_id
        relationship: one_to_many
        source: inferred
      - to: account
        "on": campaign_dim_customer.customer_currency_code = account.currency_code
        relationship: many_to_one
        source: inferred
      - to: campaign_fact_ads
        "on": campaign_dim_customer.customer_id = campaign_fact_ads.customer_id
        relationship: one_to_many
        source: inferred
  campaign_dim_campaign:
    table: oh-data-warehouse.gold.campaign_dim_campaign
    columns:
      - name: campaign_id
        type: number
        descriptions:
          ai: Unique Google Ads identifier for the campaign.
      - name: customer_id
        type: number
        descriptions:
          ai: Google Ads account identifier owning this campaign.
      - name: entity_key
        type: string
        descriptions:
          ai: Internal UUID linking campaign to a business entity.
      - name: bidding_strategy_name
        type: string
        descriptions:
          ai: Human-readable name of the portfolio bidding strategy applied.
      - name: campaign_advertising_channel_sub_type
        type: string
        descriptions:
          ai: Refined sub-classification of the advertising channel type.
      - name: campaign_advertising_channel_type
        type: string
        descriptions:
          ai: "Primary ad channel: SEARCH, DISPLAY, VIDEO, etc."
      - name: campaign_bidding_strategy
        type: string
        descriptions:
          ai: Resource path referencing the portfolio bidding strategy object.
      - name: campaign_bidding_strategy_type
        type: string
        descriptions:
          ai: Bidding method used, e.g., MAXIMIZE_CONVERSIONS, MANUAL_CPC.
      - name: campaign_budget_amount_micros
        type: number
        descriptions:
          ai: Daily or recurring budget in micros (divide by 1M for dollars).
      - name: campaign_budget_explicitly_shared
        type: boolean
        descriptions:
          ai: Indicates whether budget is shared across multiple campaigns.
      - name: campaign_budget_has_recommended_budget
        type: boolean
        descriptions:
          ai: Flags if Google has a recommended budget suggestion available.
      - name: campaign_budget_period
        type: string
        descriptions:
          ai: "Budget cycle period: DAILY or CUSTOM_PERIOD."
      - name: campaign_budget_recommended_budget_amount_micros
        type: number
        descriptions:
          ai: Google-recommended budget amount in micros.
      - name: campaign_budget_total_amount_micros
        type: number
        descriptions:
          ai: Lifetime total budget cap in micros for custom-period budgets.
      - name: campaign_campaign_budget
        type: string
        descriptions:
          ai: Resource path referencing the associated campaign budget object.
      - name: campaign_end_date
        type: time
        descriptions:
          ai: Scheduled date when the campaign stops serving ads.
      - name: campaign_experiment_type
        type: string
        descriptions:
          ai: Indicates if campaign is a BASE, DRAFT, or EXPERIMENT variant.
      - name: campaign_manual_cpc_enhanced_cpc_enabled
        type: boolean
        descriptions:
          ai: Whether enhanced CPC adjustments are enabled for manual CPC bidding.
      - name: campaign_maximize_conversion_value_target_roas
        type: number
        descriptions:
          ai: Target return on ad spend for maximize conversion value strategy.
      - name: campaign_name
        type: string
        descriptions:
          ai: Descriptive name identifying the campaign, often including service line.
      - name: campaign_percent_cpc_enhanced_cpc_enabled
        type: boolean
        descriptions:
          ai: Whether enhanced CPC is enabled for percent CPC bidding.
      - name: campaign_serving_status
        type: string
        descriptions:
          ai: "Current delivery status: SERVING, ENDED, or other Google statuses."
      - name: campaign_start_date
        type: time
        descriptions:
          ai: Date the campaign began or is scheduled to begin serving.
      - name: campaign_status
        type: string
        descriptions:
          ai: "Operational status set by advertiser: ENABLED, PAUSED, or REMOVED."
      - name: campaign_tracking_url_template
        type: string
        descriptions:
          ai: URL template appended to ads for click tracking purposes.
      - name: campaign_url_custom_parameters
        type: string
        descriptions:
          ai: Key-value pairs substituted into tracking URL templates.
      - name: parsed_service_line
        type: string
        descriptions:
          ai: Business service line extracted from the campaign name.
      - name: parsed_sub_specialty
        type: string
        descriptions:
          ai: Medical or business sub-specialty parsed from the campaign name.
    descriptions:
      ai: Google Ads campaign dimension table storing configuration, budget, bidding, and targeting details for each advertising campaign.
    joins:
      - to: ad_history
        "on": campaign_dim_campaign.campaign_id = ad_history.base_campaign_id
        relationship: one_to_many
        source: inferred
      - to: ad_stats
        "on": campaign_dim_campaign.campaign_id = ad_stats.base_campaign_id
        relationship: one_to_many
        source: inferred
      - to: ad_stats
        "on": campaign_dim_campaign.campaign_id = ad_stats.campaign_id
        relationship: one_to_many
        source: inferred
      - to: budget_history
        "on": campaign_dim_campaign.campaign_id = budget_history.campaign_id
        relationship: one_to_many
        source: inferred
      - to: campaign_conversion_optimizer_eligibility_history
        "on": campaign_dim_campaign.campaign_id = campaign_conversion_optimizer_eligibility_history.campaign_id
        relationship: one_to_many
        source: inferred
      - to: campaign_criterion_history
        "on": campaign_dim_campaign.campaign_id = campaign_criterion_history.base_campaign_id
        relationship: one_to_many
        source: inferred
      - to: campaign_criterion_history
        "on": campaign_dim_campaign.campaign_id = campaign_criterion_history.campaign_id
        relationship: one_to_many
        source: inferred
      - to: campaign_geo_target_type_setting_history
        "on": campaign_dim_campaign.campaign_id = campaign_geo_target_type_setting_history.campaign_id
        relationship: one_to_many
        source: inferred
      - to: campaign_history
        "on": campaign_dim_campaign.campaign_id = campaign_history.base_campaign_id
        relationship: one_to_many
        source: inferred
      - to: campaign_label_history
        "on": campaign_dim_campaign.campaign_id = campaign_label_history.campaign_id
        relationship: one_to_many
        source: inferred
      - to: campaign_targeting_setting_history
        "on": campaign_dim_campaign.campaign_id = campaign_targeting_setting_history.campaign_id
        relationship: one_to_many
        source: inferred
      - to: keyword_stats
        "on": campaign_dim_campaign.campaign_id = keyword_stats.base_campaign_id
        relationship: one_to_many
        source: inferred
      - to: keyword_stats
        "on": campaign_dim_campaign.campaign_id = keyword_stats.campaign_id
        relationship: one_to_many
        source: inferred
      - to: location
        "on": campaign_dim_campaign.campaign_id = location.campaign_id
        relationship: one_to_many
        source: inferred
      - to: campaign_dim_ad
        "on": campaign_dim_campaign.campaign_id = campaign_dim_ad.campaign_id
        relationship: one_to_many
        source: inferred
      - to: campaign_dim_adgroup
        "on": campaign_dim_campaign.campaign_id = campaign_dim_adgroup.campaign_id
        relationship: one_to_many
        source: inferred
      - to: campaign_dim_customer
