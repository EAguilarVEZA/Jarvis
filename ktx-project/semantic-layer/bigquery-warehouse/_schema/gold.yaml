        type: number
        descriptions:
          ai: Total clicks recorded on the ad.
      - name: micro_conversions
        type: number
        descriptions:
          ai: Count of lower-funnel conversion actions tracked.
      - name: micro_conversions_value
        type: number
        descriptions:
          ai: Monetary value attributed to micro conversions.
      - name: cost
        type: number
        descriptions:
          ai: Total ad spend in account currency.
      - name: gmail_forwards
        type: number
        descriptions:
          ai: Number of times a Gmail ad was forwarded.
      - name: gmail_saves
        type: number
        descriptions:
          ai: Number of times a Gmail ad was saved.
      - name: gmail_secondary_click
        type: number
        descriptions:
          ai: Clicks on expanded Gmail ad content.
      - name: impressions
        type: number
        descriptions:
          ai: Total times the ad was shown to users.
      - name: interaction_event_types
        type: string
        descriptions:
          ai: List of interaction types recorded, e.g., CLICK.
      - name: interactions
        type: number
        descriptions:
          ai: Total user interactions with the ad.
      - name: ad_network_type
        type: string
        descriptions:
          ai: Network where ad served, e.g., SEARCH or SEARCH_PARTNERS.
      - name: click_type
        type: string
        descriptions:
          ai: Type of click recorded, e.g., URL_CLICKS, CALLS, SITELINKS.
      - name: date
        type: time
        descriptions:
          ai: Calendar date of the performance data.
      - name: device
        type: string
        descriptions:
          ai: Device category of the user, e.g., MOBILE, DESKTOP, TABLET.
      - name: Hierarchy_L1
        type: string
        descriptions:
          ai: Top-level organizational entity, e.g., health system name.
      - name: Hierarchy_L2
        type: string
        descriptions:
          ai: Second organizational level, typically geographic region.
      - name: Hierarchy_L3
        type: string
        descriptions:
          ai: Third organizational level, typically health network brand.
      - name: Hierarchy_L4
        type: string
        descriptions:
          ai: Fourth level representing a service line or department.
      - name: Hierarchy_L5
        type: string
        descriptions:
          ai: Fifth level representing a specific facility or program.
      - name: Hierarchy_L6
        type: string
        descriptions:
          ai: Sixth level representing a sub-specialty or service within a facility.
    descriptions:
      ai: Daily ad performance metrics from Google Ads, segmented by ad, device, network, and organizational hierarchy.
